[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "patchflow"
version = "0.1.0"
description = "A verifier-guided repository-level code agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PatchFlow Contributors" },
]
dependencies = [
    "pydantic>=2.10,<3.0",
]

[project.scripts] # 暴露可直接运行的实验 CLI。
patchflow = "patchflow.cli:main" # 将命令行入口绑定到主函数。

[project.optional-dependencies]
model-openai = [ # 真实模型适配器使用的可选依赖组。
    "openai>=3.16,<4", # 锁定已离线验收的 SDK 主版本范围。
] # 结束可选模型依赖列表。
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["patchflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# 中文逐行注释会自然使用全角标点并拉长行宽，因此关闭只影响排版、不影响程序正确性的规则。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
